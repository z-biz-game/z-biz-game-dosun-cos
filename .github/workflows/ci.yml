name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: 零运行时依赖。为了"证明点什么"而往 CI 里塞浏览器或打包器，
      # 这个仓就会开始因为网络抖动而红。
      # 名单只有一份：CI 调 `npm run check`，与本地同一条命令（package.json 里改了 glob 这里就跟着改）。
      - name: Syntax check every source
        run: npm run check

      # 真正的承诺：判据 / 计数器 / 铅笔 / 官方 4×4 夹具 / 出题器台阶 / 文档对表 —— 纯 node，不需要浏览器。
      - name: Logic gates
        run: npm test

      # 破坏试验台账：`npm test` 的名单里已经有它（GATES 的倒数第二条），这一步单独点出来，
      # 为的是"doctest 不是空转"这件事在 CI 里有自己的一个步骤名，README 的覆盖表也拿它对的回。
      # 本地走的是同一条命令（npm run sabotage / npm test 里的同一条闸），CI 没有只自己才有的门。
      - name: Sabotage ledger proves doctest can go red
        run: npm run sabotage

  # 真浏览器闸：headless Chrome + CDP，读 DOM 文本/几何、真事件与引擎读数，不读内部标志位。
  # 独立 job、node 22：台架用的是 Node 22 才有的全局 WebSocket/fetch，在 20 上第一次 attach 就死。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # verify.sh 自己起 server；根形态与 Pages 的 /z-biz-game-dosun-cos/ 前缀形态各跑同一套腿，
      # 每条腿报出的断言条数逐条相同才算绿。
      - name: Browser gate, both local URL shapes
        env:
          WD_TIMEOUT: 900
        run: npm run verify

      # 阴性自证：闸必须能被证明"会红"。种一条注定错的期望，必须 rc 非 0 且点名是哪条腿吃下的。
      # 命令也只有一份（package.json 的 selftest），CI 不另写一遍环境变量串。
      - name: Gate proves it can fail
        env:
          WD_TIMEOUT: 900
        run: |
          set +e
          npm run selftest > _tmp-selftest.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc"
          grep -E 'SELFTEST·|种下的错被' _tmp-selftest.log
          [ "$rc" -ne 0 ] || { echo "SELFTEST 竟然全绿：这个闸证明不了自己会红"; exit 1; }
          grep -q 'FAIL' _tmp-selftest.log || { echo "SELFTEST 红了但没有点名是哪条断言"; exit 1; }
